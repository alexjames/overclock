services:
  app:
    image: buildbreak/overclock:latest
    restart: always
    volumes:
      - ./data:/data
    environment:
      - DATA_FILE_PATH=/data/courses.json

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
