services:
  app:
    image: buildbreak/overclock:latest
    build: .
    restart: always
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx_local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

